<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #0e1113; color: #e9eef0;
         font-family: system-ui, "Segoe UI", sans-serif; }
  main { max-width: 440px; padding: 0 24px; text-align: center; }
  h1 { font-size: 26px; font-weight: 650; margin: 0 0 10px; }
  p { color: #8c99a0; line-height: 1.5; margin: 0 0 22px; }
  strong { color: #e9eef0; }
  button { background: #1e2428; color: #e9eef0; border: 1px solid #283035; border-radius: 12px;
           padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #283036; }
</style>
</head>
<body>
<main>
  <h1>This site is blocked</h1>
  <p><strong id="host">This site</strong> is on your blocked list. Remove it in EyeTrack &gt; Settings &gt; Blocked apps and sites.</p>
  <button id="back" type="button">Go back</button>
</main>
<script src="blocked.js"></script>
</body>
</html>
