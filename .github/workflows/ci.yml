name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: python setup.py --no-input --skip-models --skip-extension
      - name: Run tests in the setup venv
        shell: bash
        run: |
          PY=engine/.venv/bin/python
          [ -x "$PY" ] || PY=engine/.venv/Scripts/python.exe
          "$PY" -m pip install pytest
          "$PY" -m pytest engine/tests -q
      - run: python -m py_compile engine/engine.py engine/study.py
      - if: matrix.os == 'ubuntu-latest'
        run: |
          node --check extension/background.js
          node --check extension/content.js
